[package]
name = "agv-sim"
version = "0.1.0"
edition = "2021"
description = "The agrivoltaic garden model's physics core: solar geometry, shared by the web app and anything else that needs the same answers"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies, and that is deliberate: the boundary this crate
# exposes is f64 in and f64 out, which the raw wasm ABI expresses without wasm-bindgen. See
# src/wasm.rs. Nothing here needs a network to build, which is also what keeps CI simple.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
