    <!--
      The only content anything that does not run JavaScript will ever see, which is why it is
      real prose and not "please enable JavaScript". A cold link gets read by crawlers, by link
      previews and by whatever tooling a recipient triages their inbox with, and an empty shell
      tells all of them nothing. What it says is also the honest short version: what the tool
      does, at what scale, and what it is not.
    -->
    <noscript>
      <main
        style="
          max-width: 42rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font: 16px/1.6 ui-serif, Georgia, serif;
        "
      >
        <h1>Agrivoltaic Garden Planner</h1>
        <p>
          A site-specific model of the light a solar array leaves on the ground. It reads the sun,
          weather and soil at a real address, simulates the light reaching each bed through the
          year, and ranks crops against the light it measured there.
        </p>
        <p>
          It works at <strong>garden scale</strong>: beds a person reaches across, paths a
          wheelbarrow fits down, arrays of a few rows. It is not a farm planning tool and models
          no tractor or implement access.
        </p>
        <p>
          Outputs are planning estimates from a model. They are not agronomic or engineering
          recommendations, and the tool has not been validated against a real garden.
        </p>
        <p>
          Where the numbers come from, including the ones this project cannot yet source and
          therefore does not present as findings:
          <a href="/docs/">the modelling documents and citation corpus</a>.
        </p>
        <p>
          The tool itself needs JavaScript and WebGL2, because it renders and simulates a 3D scene
          in the browser. Nothing is stored on a server and there is no sign-up.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
